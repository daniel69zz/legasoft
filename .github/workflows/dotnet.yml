name: Solución .NET

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "*.props", "Pharmacy.sln", "global.json", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "*.props", "Pharmacy.sln", "global.json", ".github/workflows/dotnet.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restaurar
        run: dotnet restore Pharmacy.sln
      - name: Compilar
        run: dotnet build Pharmacy.sln --no-restore -c Release
      - name: Pruebas xUnit con cobertura
        run: dotnet test Pharmacy.sln --no-build -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=resultados.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: TestResults
