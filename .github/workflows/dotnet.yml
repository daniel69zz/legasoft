name: Solución .NET

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "tools/**", "*.props", "Pharmacy.sln", "global.json", ".github/workflows/dotnet.yml", ".github/scripts/**"]
  pull_request:
    paths: ["src/**", "tests/**", "tools/**", "*.props", "Pharmacy.sln", "global.json", ".github/workflows/dotnet.yml", ".github/scripts/**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restaurar
        run: dotnet restore Pharmacy.sln
      - name: Compilar
        run: dotnet build Pharmacy.sln --no-restore -c Release
      - name: Pruebas xUnit con cobertura
        run: dotnet test Pharmacy.sln --no-build -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=resultados.trx" --results-directory TestResults
      # SCRUM-131 · HU-T05.1 (RNF-007): resumen de cobertura y umbral del 70 % en los servicios de negocio críticos
      - name: Cobertura (umbral 70 %)
        run: python3 .github/scripts/cobertura.py TestResults 70
      # SCRUM-40 · HU-T05 (RNF-007): complejidad ciclomática promedio de 10 o menos por método
      - name: Complejidad ciclomática (umbral 10)
        run: |
          dotnet run --project tools/Complexity -c Release -- --umbral 10 \
            src/shared/Pharmacy.Domain src/shared/Pharmacy.Application src/backend/Business.Api \
            src/backend/Identity.Api src/backend/Sync.Api | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: TestResults
