# HU-T02.2 (RNF-003): publica el API Gateway con HTTPS (TLS 1.2 o superior) a través del nginx
# del servidor, que ya atiende los puertos 80 y 443 para los demás sitios del VPS.
# El Gateway escucha solo en 127.0.0.1:${GATEWAY_PORT} (deploy/vps/docker-compose.vps.yml).
#
# Instalación (una vez), con el dominio apuntando al VPS:
#   sudo cp deploy/vps/nginx-farmacia.conf /etc/nginx/sites-available/farmacia
#   sudo ln -s /etc/nginx/sites-available/farmacia /etc/nginx/sites-enabled/farmacia
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d farmacia.bell7738.com --redirect
#
# Certbot agrega el bloque de HTTPS, la redirección desde HTTP y renueva el certificado. Su
# options-ssl-nginx.conf fija ssl_protocols TLSv1.2 TLSv1.3. Los puestos se conectan con
#   --Desktop:GatewayUrl=https://farmacia.bell7738.com
server {
    server_name farmacia.bell7738.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:5100;   # GATEWAY_PORT de .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
